name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the marketplace file
        run: |
          npm install --global --silent @anthropic-ai/claude-code@2.1.332
          claude plugin validate .
